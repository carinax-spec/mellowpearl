<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellow Pearl Japan | Official Site</title>
    <style>
        :root {
            --main-grey: #f4f4f4;
            --text-dark: #333333;
            --accent-gold: #c5a059;
            --bg-charcoal: #2d2d2d;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--main-grey);
            color: var(--text-dark);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        header {
            width: 100%; max-width: 1100px;
            margin: 0 auto; overflow: hidden;
            background-color: #fff;
        }
        header img { width: 100%; height: auto; display: block; }

        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        .brand-header { text-align: center; margin-bottom: 50px; }
        .brand-title { font-size: 2.2rem; letter-spacing: 0.3rem; color: var(--bg-charcoal); margin: 0; }
        .brand-subtitle { font-size: 0.9rem; color: var(--accent-gold); font-weight: bold; margin-top: 15px; letter-spacing: 1px; }

        .content-section {
            background-color: #fff;
            padding: 50px 40px;
            border-radius: 2px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            text-align: center; /* コンセプトを中央寄せに */
            margin-bottom: 60px;
        }

        .concept-text {
            font-size: 1rem;
            text-align: left;
            display: inline-block;
            max-width: 550px;
            margin: 0 auto;
        }

        .concept-highlight {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--bg-charcoal);
            display: block;
            margin-bottom: 20px;
            text-align: center;
        }

        h2 { 
            border-bottom: 1px solid var(--accent-gold); 
            display: inline-block;
            padding-bottom: 5px;
            font-size: 1.2rem; 
            margin-top: 40px; 
            margin-bottom: 25px;
        }
        
        .pearl-types {
            display: flex; justify-content: center; flex-wrap: wrap;
            margin: 10px 0 30px 0; gap: 12px;
        }
        .pearl-tag {
            border: 1px solid var(--bg-charcoal); color: var(--bg-charcoal);
            padding: 4px 18px; border-radius: 0px; font-size: 0.85rem;
            transition: all 0.3s;
        }
        .pearl-tag:hover { background: var(--bg-charcoal); color: #fff; }

        .shop-navigation { text-align: center; margin-top: 40px; }
