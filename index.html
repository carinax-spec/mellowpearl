<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellow Pearl Japan | Official Site</title>
    <style>
        :root {
            --main-grey: #f8f8f8;
            --text-dark: #2d2d2d;
            --accent-gold: #c5a059;
            --btn-bg: #3a3a3a;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--main-grey);
            color: var(--text-dark);
            text-align: center;
        }

        .banner {
            width: 100%; max-width: 1100px;
            margin: 0 auto; display: block;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 { font-size: 1.8rem; letter-spacing: 3px; margin-bottom: 5px; }
        .sub-tag { color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 30px; display: block; }

        /* 链接按钮样式 */
        .link-list { margin-top: 40px; }
        .link-item {
            display: block;
            background: #fff;
            color: var(--text-dark);
            text-decoration: none;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .link-item:hover {
            background: var(--btn-bg);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .brand-hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 10px;
        }

        footer { margin-top: 80px; padding: 40px; font-size: 0.7rem; color: #999; }
    </style>
</head>
<body>

    <img src="banner.jpg" class="banner" alt="Mellow Pearl Japan">

    <div class="container">
        <h1>MELLOW PEARL JAPAN</h1>
        <span class="sub-tag">「自分らしさ」を、最高級の真珠で彩る。</span>

        <p style="font-size: 0.9rem; line-height: 1.6;">
            大阪・西区のアトリエから届ける<br>
            厳選された最高級パールの輝き。
        </p>

        <div class="link-list">
            <a href="https://jp.mercari.com/user/profile/176032430" class="link-item" target="_blank">
                🛒 Mercari Shop (Hana Pearl)
                <div class="brand-hint">※メルカリ公式旗艦店</div>
            </a>

            <a href="#" class="link-item" target="_blank">
                🎨 minne Official Store
                <div class="brand-hint">※Coming Soon</div>
            </a>

            <a href="#" class="link-item">
                📸 Instagram
            </a>
        </div>

        <div style="margin-top: 50px; font-size: 0.85rem; border-top: 1px solid #eee; padding-top: 30px;">
            <p><strong>Wear it last, take it off first.</strong></p>
        </div>
    </div>

    <footer>
        &copy; 2026 Mellow Pearl Japan / 羽天株式会社
    </footer>

</body>
</html>
