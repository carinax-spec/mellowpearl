<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellow Pearl Japan | Official Site</title>
    <style>
        :root {
            --main-grey: #f4f4f4;
            --text-dark: #333333;
            --accent-gold: #c5a059;
            --bg-charcoal: #2d2d2d;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--main-grey);
            color: var(--text-dark);
            line-height: 1.8;
        }

        /* 顶部 Banner */
        .banner-container {
            width: 100%; max-width: 1100px;
            margin: 0 auto; overflow: hidden;
            background-color: #fff;
        }
        .banner-container img { width: 100%; height: auto; display: block; }

        main { max-width: 800px; margin: 20px auto; padding: 0 20px; }

        /* 新增：快速引流板块 */
        .quick-links {
            margin-bottom: 50px;
            text-align: center;
        }
        .link-item {
            display: block;
            background: #fff;
            color: var(--text-dark);
            text-decoration: none;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: bold;
        }
        .link-item:hover {
            background: var(--bg-charcoal);
            color: #fff;
            transform: translateY(-2px);
        }
        .brand-hint { font-weight: normal; font-size: 0.75rem; color: #888; margin-top: 4px; }

        /* 原有：品牌内容板块 */
        .brand-header { text-align: center; margin-bottom: 40px; }
        .brand-title { font-size: 1.8rem; letter-spacing: 0.2rem; color: var(--bg-charcoal); margin-bottom: 10px; }
        .brand-subtitle { font-size: 0.95rem; color: var(--accent-gold); font-weight: bold; }

        .content-section {
            background-color: #fff;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: left;
        }

        h2 { border-left: 4px solid var(--accent-gold); padding-left: 15px; font-size: 1.2rem; margin-top: 30px; }
        
        .pearl-types {
            display: flex; justify-content: space-around; flex-wrap: wrap;
            margin: 25px 0; gap: 10px;
        }
        .pearl-tag {
            background: var(--bg-charcoal); color: #fff;
            padding: 5px 15px; border-radius: 20px; font-size: 0.85rem;
        }

        footer {
            margin-top: 60px; padding: 40px 0;
            background-color: var(--bg-charcoal); color: #fff;
            text-align: center; font-size: 0.75rem;
        }
    </style>
</head>
<body>

<header>
    <div class="banner-container">
        <img src="banner.jpg" alt="Mellow Pearl Japan Banner">
    </div>
</header>

<main>
